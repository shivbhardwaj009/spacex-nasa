[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spherex-sky-diary"
version = "0.1.0"
description = "SPHEREx Sky Diary - NASA Space Apps Challenge 2026: Planet X and SPHEREx"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SPHEREx Sky Diary Team" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "astropy>=6.0.0",
    "photutils>=1.12.0",
    "reproject>=0.13.0",
    "astroquery>=0.4.7",
    "jsonschema>=4.20.0",
    "pyyaml>=6.0.1",
    "pillow>=10.2.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

